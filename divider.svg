<svg xmlns="http://www.w3.org/2000/svg" width="700" height="24" viewBox="0 0 700 24" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
